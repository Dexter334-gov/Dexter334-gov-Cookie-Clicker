<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cookie Clicker Game</title>
    <style>
        body {
            background: #2c1d11 url('Bakery Background.jpg') repeat;
            background-size: auto;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 5px;
        }
        .stats-box {
            background-color: rgba(74, 51, 25, 0.85);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            border: 2px solid #6d4c25;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        #cookie-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.05s ease-in-out;
        }
        #cookie-btn:active {
            transform: scale(0.92);
        }
        #cookie-btn img {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6));
        }
        .shop-container {
            max-width: 400px;
            margin: 30px auto;
            background: rgba(61, 40, 20, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #573c1e;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #52361b;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #6e4924;
        }
        .shop-item button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .shop-item button:hover {
            background-color: #2ecc71;
        }
        .shop-item button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        /* Audio Control Button Styles */
        #audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(74, 51, 25, 0.9);
            border: 2px solid #6d4c25;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #mute-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #mute-btn:hover {
            background-color: #c0392b;
        }
        #track-display {
            font-size: 11px;
            color: #f1c40f;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <h1>Cookie Clicker</h1>
    <p>Click the cookie to grow your empire!</p>

    <div class="stats-box">
        <h2 id="cookie-count">0 cookies</h2>
        <p id="cps-display">per second: 0</p>
    </div>

    <div>
        <button id="cookie-btn" onclick="clickCookie()">
            <img src="Cookie.png" alt="Cookie">
        </button>
    </div>

    <div class="shop-container">
        <h3>Automation Center</h3>
        
        <!-- Modified Tier 1: Digital Auto Clicker -->
        <div class="shop-item">
            <div>
                <strong>Auto-Clicker Bot</strong><br>
                <span>Produces: +0.2 CPS</span>
            </div>
            <button id="buy-clicker" onclick="buyAsset('clicker')">Buy (Cost: 15)</button>
        </div>

        <!-- Modified Tier 2: Higher level automated scripting -->
        <div class="shop-item">
            <div>
                <strong>Macro Script</strong><br>
                <span>Produces: +1.5 CPS</span>
            </div>
            <button id="buy-macro" onclick="buyAsset('macro')">Buy (Cost: 100)</button>
        </div>
    </div>

    <!-- Audio Player Interface Element (Bottom Right) -->
    <div id="audio-controls">
        <div id="track-display">Loading music...</div>
        <button id="mute-btn" onclick="toggleMute()">Mute</button>
    </div>

    <script>
        // Game Logic Setup
        let cookies = 0;
        let cps = 0;

        // Custom Tech/Automation Themed Upgrades
        const assets = {
            clicker: { count: 0, baseCost: 15, currentCost: 15, cpsValue: 0.2 },
            macro: { count: 0, baseCost: 100, currentCost: 100, cpsValue: 1.5 }
        };

        function clickCookie() {
            cookies += 1;
            updateDisplay();
            
            // Web browsers require user interaction before they allow music to play automatically.
            // This initializes your playlist on the very first click if it hasn't started yet.
            if (!hasStartedMusic) {
                playNextTrack();
                hasStartedMusic = true;
            }
        }

        function buyAsset(type) {
            let asset = assets[type];
            if (cookies >= asset.currentCost) {
                cookies -= asset.currentCost;
                asset.count++;
                asset.currentCost = Math.floor(asset.baseCost * Math.pow(1.15, asset.count));
                calculateCPS();
                updateDisplay();
            }
        }

        function calculateCPS() {
            cps = (assets.clicker.count * assets.clicker.cpsValue) + 
                  (assets.macro.count * assets.macro.cpsValue);
        }

        function updateDisplay() {
            // Display numbers cleaner by rounding down to the nearest whole integer
            document.getElementById('cookie-count').innerText = Math.floor(cookies) + " cookies";
            document.getElementById('cps-display').innerText = "per second: " + cps.toFixed(1);
            
            document.getElementById('buy-clicker').innerText = `Buy (${assets.clicker.currentCost})`;
            document.getElementById('buy-clicker').disabled = (cookies < assets.clicker.currentCost);

            document.getElementById('buy-macro').innerText = `Buy (${assets.macro.currentCost})`;
            document.getElementById('buy-macro').disabled = (cookies < assets.macro.currentCost);
        }

        // --- Multi-track Jukebox Audio System ---
        const playlist = [
            'nuance3.ogg',
            'hal5.ogg',
            'droopy.ogg',
            'piano4.ogg',
            'nuance4.ogg',
            'menu6.ogg',
            'menu5.ogg'
        ];
        
        let currentTrackIndex = 0;
        let isMuted = false;
        let hasStartedMusic = false;
        
        // Create a single background audio container
        const bgMusic = new Audio();

        function playNextTrack() {
            if (playlist.length === 0) return;
            
            bgMusic.src = playlist[currentTrackIndex];
            bgMusic.muted = isMuted;
            
            // Displays current track text in bottom corner
            document.getElementById('track-display').innerText = "🎵 " + playlist[currentTrackIndex];
            
            bgMusic.play().catch(error => {
                console.log("Waiting for user tap to play audio track.");
            });

            // Automatically queue up next track when current one finishes
            bgMusic.onended = function() {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                playNextTrack();
            };
        }

        function toggleMute() {
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerText = "Unmute";
                muteBtn.style.backgroundColor = "#27ae60";
            } else {
                muteBtn.innerText = "Mute";
                muteBtn.style.backgroundColor = "#e74c3c";
                
                // If audio layout stalled from lack of click, restart it here
                if (!hasStartedMusic) {
                    playNextTrack();
                    hasStartedMusic = true;
                }
            }
        }

        // Run game tickers
        setInterval(function() {
            if (cps > 0) {
                cookies += (cps / 10);
                updateDisplay();
            }
        }, 100);

        updateDisplay();
    </script>

</body>
</html>
